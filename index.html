<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERSUSONE — Arena Duel</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f4f6fb, #e8ecf7);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 10px;
      min-height: 100vh;
    }

    .container {
      display: flex;
      gap: 24px;
      width: 100%;
      max-width: 1100px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 6px 20px rgba(10, 20, 30, 0.08);
      flex: 1;
      min-width: 280px;
    }

    /* Panel Profil */
    .profile h2 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    .profile label {
      display: block;
      font-size: 14px;
      margin-top: 8px;
      color: #555;
    }

    .profile input,
    .profile select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-top: 4px;
    }

    .profile button {
      margin-top: 16px;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    /* Arena */
    .arena h1 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .arena p {
      font-size: 14px;
      color: #444;
      margin-bottom: 20px;
    }

    .arena input,
    .arena select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      margin-bottom: 12px;
    }

    .arena button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    /* Peta */
    .map h3 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .map .visual {
      height: 180px;
      background: repeating-linear-gradient(
        90deg,
        #f0f3fa,
        #f0f3fa 20px,
        #e1e5f0 20px,
        #e1e5f0 40px
      );
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #777;
      font-size: 14px;
    }

    .map .status {
      background: #f9fafc;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    /* Responsif */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Kiri: Profil -->
    <div class="card profile">
      <h2>Edit Profil</h2>
      <label for="nama">Nama</label>
      <input type="text" id="nama" placeholder="Masukkan nama lo">
      <label for="umur">Umur</label>
      <input type="number" id="umur" placeholder="Umur lo">
      <label for="gender">Jenis Kelamin</label>
      <select id="gender">
        <option value="">Pilih</option>
        <option value="laki">Laki-laki</option>
        <option value="perempuan">Perempuan</option>
      </select>
      <button id="saveProfile">Simpan Profil</button>
    </div>

    <!-- Tengah: Arena -->
    <div class="card arena">
      <h1>WHAT'S UP DAWG!</h1>
      <p>Selamat datang di arena. Masukin data tinggi & berat lo, biar sistem nyariin lawan yang sepadan. Satu klik, satu duel.</p>

      <label for="tinggi">Tinggi badan (cm)</label>
      <input type="number" id="tinggi" placeholder="Masukkan tinggi badan">

      <label for="berat">Berat badan (kg)</label>
      <input type="number" id="berat" placeholder="Masukkan berat badan">

      <label for="range">Range lawan</label>
      <select id="range">
        <option value="dekat">Easy</option>
        <option value="jauh">Hard</option>
      </select>

      <button id="cariLawan">Mulai Cari Lawan</button>
    </div>

    <!-- Kanan: Peta -->
    <div class="card map">
      <h3>Peta Matchmaking</h3>
      <div class="visual" id="mapVisual">(visual peta sederhana)</div>
      <div class="status" id="statusMatch">
        Belum mencari lawan.<br />
        Isi data lalu klik <b>"Mulai Cari Lawan"</b>.
      </div>
    </div>
  </div>

  <script>
    // === SIMPAN & LOAD PROFIL ===
    const nama = document.getElementById('nama');
    const umur = document.getElementById('umur');
    const gender = document.getElementById('gender');
    const tinggi = document.getElementById('tinggi');
    const berat = document.getElementById('berat');
    const statusMatch = document.getElementById('statusMatch');
    const mapVisual = document.getElementById('mapVisual');

    // Load data dari localStorage pas pertama kali buka
    window.addEventListener('load', () => {
      if(localStorage.getItem('nama')) nama.value = localStorage.getItem('nama');
      if(localStorage.getItem('umur')) umur.value = localStorage.getItem('umur');
      if(localStorage.getItem('gender')) gender.value = localStorage.getItem('gender');
    });

    // Simpan profil
    document.getElementById('saveProfile').addEventListener('click', () => {
      localStorage.setItem('nama', nama.value);
      localStorage.setItem('umur', umur.value);
      localStorage.setItem('gender', gender.value);
      alert('Profil lo udah disimpan, dawg!');
    });

    // === MATCHMAKING SIMULASI ===
    document.getElementById('cariLawan').addEventListener('click', () => {
      const t = tinggi.value;
      const b = berat.value;

      if(!t || !b) {
        alert('Isi tinggi dan berat badan dulu, dawg!');
        return;
      }

      statusMatch.innerHTML = 'Mencari lawan... ⏳';
      mapVisual.textContent = '(loading...)';

      setTimeout(() => {
        statusMatch.innerHTML = `🔥 Lawan ditemukan! <br>Nama: Asep <br>Tinggi: 171 cm | Berat: 62 kg <br>Jarak: Dekat`;
        mapVisual.textContent = '📍 Titik duel ditentukan';
      }, 2500);
    });
  </script>
</body>
</html>
